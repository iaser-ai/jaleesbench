# Urdu — SKELETON (plan phase tts_spike). Complete language lands over
# later phases: prompt.txt (translated_prompts), vo/ + cards/
# (localized_content). Loading fails fast until then, by design.
#
# voice: Puck — APPROVED by Waleed's listen test 2026-07-28 (consistency
# with the shipped EN videos). Urdu flight risk CLOSED: Gemini TTS Urdu
# quality accepted, no fallback chain needed. Record:
# reference/tts-spike.md.
lang = "ur"
name = "Urdu"
dir = "rtl"

[tts]
engine = "gemini"
model = "gemini-3.1-flash-tts-preview"
voice = "Puck"
style = "Say this as a warm, confident, genuinely engaging tutorial narrator, speaking natural Urdu — clearly glad to share it, good energy and momentum, but respectful and grounded, not hyped: "
# Prefix names the voice so a future voice change can't reuse stale cache.
cache_prefix = "ur-puck1"

[cards]
# Urdu readers expect Nastaliq, not Naskh. Nastaliq's vertical metrics are
# much taller than Latin/Naskh — the generous line-height prevents the
# clipping called out in the spec's RTL requirements.
css = """
  .wrap { font-family:'Noto Nastaliq Urdu',serif; }
  h1 { line-height:2.0; font-size:46px; }
  .kicker, .sub { line-height:2.0; }
"""

[recording]
prompt_url = "https://iaser.ai/ur/prompt"
prompt_url_display = "iaser.ai/ur/prompt"
copy_button_label = "نقل کریں"  # public pages localize the button x3 (full, part1, part2)
article_url = "https://iaser.ai/articles/ur/jaleesbench-companion-prompt"
article_url_display = "iaser.ai/articles/ur/jaleesbench-companion-prompt"
# Takes ENTER on the article (the real reader path). Localized by
# iaser.ai 2026-07-29; kept as its own key because the article and
# the prompt page are localized independently and diverged once.
article_copy_button_label = "نقل کریں"
prompt_chars = 1318
gemini_part_min = 603
gemini_part2_leadin = "یہ باقی ہدایات ہیں؛ ان پر پچھلی ہدایات کے ساتھ عمل کریں۔ ان سب کا مقصد ایک ہی ہے: ایسی سچی مدد جو اچھا اثر چھوڑ جائے:"
gemini_part_max = 832
# PENDING: localized card strings (localized_content phase).
card_goto_line = "اپنے براؤزر میں جائیں"
card_open_line = "اب کھولیں"
account_label = "waleedkadous"

[recording.chatgpt_ui]
# Discovered live under the ur Accept-Language session (2026-07-29).
# `save` only renders once the field is DIRTY (it appears next to
# منسوخ کریں = Cancel, and Cancel comes FIRST in DOM order — don't grab
# the first new button). toast_substr is the full phrase on purpose.
personalization = "شخصی بناوٹ"
ci_placeholder_substr = "اضافی رویّہ"
save = "محفوظ کریں"
toast_substr = "حسب ضرورت ہدایات اپ ڈیٹ کی گئیں"

[recording.gemini_ui]
# add/submit observed live 2026-07-29. delete_all only renders when the
# list is non-empty, so it is filled in after the first ur take; until
# then it falls back to the EN default (keys merge over defaults).
add = "شامل کریں"
submit = "جمع کرائیں"

[youtube]
video_language = "Urdu"

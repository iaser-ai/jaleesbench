# Urdu — SKELETON (plan phase tts_spike). Complete language lands over
# later phases: prompt.txt (translated_prompts), vo/ + cards/
# (localized_content). Loading fails fast until then, by design.
#
# voice: Puck — APPROVED by Waleed's listen test 2026-07-28 (consistency
# with the shipped EN videos). Urdu flight risk CLOSED: Gemini TTS Urdu
# quality accepted, no fallback chain needed. Record:
# reference/tts-spike.md.
lang = "ur"
name = "Urdu"
dir = "rtl"

[tts]
engine = "gemini"
model = "gemini-3.1-flash-tts-preview"
voice = "Puck"
style = "Say this as a warm, confident, genuinely engaging tutorial narrator, speaking natural Urdu — clearly glad to share it, good energy and momentum, but respectful and grounded, not hyped: "
# Prefix names the voice so a future voice change can't reuse stale cache.
cache_prefix = "ur-puck1"

[cards]
# Urdu readers expect Nastaliq, not Naskh. Nastaliq's vertical metrics are
# much taller than Latin/Naskh — the generous line-height prevents the
# clipping called out in the spec's RTL requirements.
#
# Guarded, because the line-height below is tuned FOR Nastaliq: if the face
# silently fell back to a Naskh-shaped serif, the cards would get Nastaliq
# spacing on the wrong typeface and nothing would error. Vendored at
# assets/fonts/ per Waleed's call (2026-07-31) and embedded as an
# @font-face, so this no longer depends on macOS happening to ship
# NotoNastaliq.ttc — same approach iaser.ai took for the web surfaces.
require_font = "Noto Nastaliq Urdu"
css = """
  .wrap { font-family:'Noto Nastaliq Urdu',serif; }
  h1 { line-height:2.0; font-size:46px; }
  .kicker, .sub { line-height:2.0; }
"""

[recording]
prompt_url = "https://iaser.ai/ur/prompt"
prompt_url_display = "iaser.ai/ur/prompt"
copy_button_label = "نقل کریں"  # public pages localize the button x3 (full, part1, part2)
article_entry_url = "https://s.iaser.ai/prompt"
article_url_display = "s.iaser.ai/prompt"
article_lang_link = "اردو"  # clicked ON CAMERA on the EN article
# Takes ENTER on the article (the real reader path). Localized by
# iaser.ai 2026-07-29; kept as its own key because the article and
# the prompt page are localized independently and diverged once.
article_copy_button_label = "نقل کریں"
prompt_chars = 1318
# SPLIT MOVED 3 -> 5 (2026-07-29, Waleed's call). Gemini hard-REFUSES
# bullet 5 — the safeguarding line — as a saved-info entry when it arrives
# in part 2: 253-char minimal repro, byte-identical refusal dialog, and
# three rewordings that preserved the duty of care verbatim were all
# refused. Riding in part 1 it saves. The boundary moves; not one word of
# the translation does. Parts become p1=955 (bullets 1-5), p2=480
# (bullet 6). Bounds re-bracket those two and still exclude both the full
# prompt (1318) and the OLD part sizes (663/772) — so a stale-cached
# prompt page after the re-vendor aborts the take instead of filming the
# superseded split.
#
# NOTE the band alone canNOT catch a stale page here: the old sizes
# (663/772) sit between the new ones (480/955), so any band holding both
# new parts holds both old ones. That is why the driver now asserts the
# clipboard byte-for-byte against gemini_parts(); the band survives only
# as a cheap first look with a readable message.
gemini_split_after = 5
gemini_part_min = 440
gemini_part2_leadin = "یہ باقی ہدایات ہیں؛ ان پر پچھلی ہدایات کے ساتھ عمل کریں۔ ان سب کا مقصد ایک ہی ہے: ایسی سچی مدد جو اچھا اثر چھوڑ جائے:"
gemini_part_max = 1000
# PENDING: localized card strings (localized_content phase).
card_goto_line = "اپنے براؤزر میں جائیں"
card_open_line = "اب کھولیں"
account_label = "waleedkadous"

[recording.chatgpt_ui]
# Discovered live under the ur Accept-Language session (2026-07-29).
# `save` only renders once the field is DIRTY (it appears next to
# منسوخ کریں = Cancel, and Cancel comes FIRST in DOM order — don't grab
# the first new button). toast_substr is the full phrase on purpose.
#
# `personalization` is the ACCOUNT-MENU item the driver clicks, which in
# ur is NOT the same string as the settings dialog's own tab
# ("شخصی بناوٹ"). Arabic uses one string for both, which hid the
# distinction until the ur take went looking for the tab label in the menu.
personalization = "ذاتی نوعیت کا بنانا"
ci_placeholder_substr = "اضافی رویّہ"
save = "محفوظ کریں"
toast_substr = "حسب ضرورت ہدایات اپ ڈیٹ کی گئیں"

[recording.gemini_ui]
# All observed live 2026-07-29 (delete_all only renders when the list
# is non-empty, so it was read during a cleanup).
add = "شامل کریں"
submit = "جمع کرائیں"
delete_all = "سبھی حذف کریں"

[youtube]
video_language = "Urdu"

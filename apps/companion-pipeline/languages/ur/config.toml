# Urdu — SKELETON (plan phase tts_spike). Complete language lands over
# later phases: prompt.txt (translated_prompts), vo/ + cards/
# (localized_content). Loading fails fast until then, by design.
#
# voice: Puck — APPROVED by Waleed's listen test 2026-07-28 (consistency
# with the shipped EN videos). Urdu flight risk CLOSED: Gemini TTS Urdu
# quality accepted, no fallback chain needed. Record:
# reference/tts-spike.md.
lang = "ur"
name = "Urdu"
dir = "rtl"

[tts]
engine = "gemini"
model = "gemini-3.1-flash-tts-preview"
voice = "Puck"
style = "Say this as a warm, confident, genuinely engaging tutorial narrator, speaking natural Urdu — clearly glad to share it, good energy and momentum, but respectful and grounded, not hyped: "
# Prefix names the voice so a future voice change can't reuse stale cache.
cache_prefix = "ur-puck1"

[cards]
# Urdu readers expect Nastaliq, not Naskh. Nastaliq's vertical metrics are
# much taller than Latin/Naskh — the generous line-height prevents the
# clipping called out in the spec's RTL requirements.
css = """
  .wrap { font-family:'Noto Nastaliq Urdu',serif; }
  h1 { line-height:2.0; font-size:46px; }
  .kicker, .sub { line-height:2.0; }
"""

[recording]
prompt_url = "https://s.iaser.ai/prompt"
prompt_url_display = "s.iaser.ai/prompt"
prompt_chars = 1318
gemini_part_min = 594
gemini_part_max = 723
# PENDING: localized card strings (localized_content phase).
card_goto_line = "اپنے براؤزر میں جائیں"
card_open_line = "اب کھولیں"
account_label = "waleedkadous"

[youtube]
video_language = "Urdu"

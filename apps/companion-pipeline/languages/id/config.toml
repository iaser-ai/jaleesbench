# Bahasa Indonesia — SKELETON (plan phase tts_spike). Complete language
# lands over later phases: prompt.txt (translated_prompts), vo/ + cards/
# (localized_content). Loading fails fast until then, by design.
#
# voice: Puck — APPROVED by Waleed's listen test 2026-07-28 (consistency
# with the shipped EN videos). Record: reference/tts-spike.md.
lang = "id"
name = "Bahasa Indonesia"
dir = "ltr"

[tts]
engine = "gemini"
model = "gemini-3.1-flash-tts-preview"
voice = "Puck"
style = "Say this as a warm, confident, genuinely engaging tutorial narrator, speaking natural Bahasa Indonesia — clearly glad to share it, good energy and momentum, but respectful and grounded, not hyped: "
# Prefix names the voice so a future voice change can't reuse stale cache.
cache_prefix = "id-puck1"

[cards]
# Latin script; EN card styling works as-is.
css = ""

[recording]
prompt_url = "https://s.iaser.ai/prompt"
prompt_url_display = "s.iaser.ai/prompt"
prompt_chars = 1499
gemini_part_min = 687
gemini_part_max = 811
# PENDING: localized card strings (localized_content phase).
card_goto_line = "Di browser Anda, buka"
card_open_line = "Sekarang buka"
account_label = "waleedkadous"

[youtube]
video_language = "Indonesian"

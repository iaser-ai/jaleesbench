# Arabic — SKELETON (plan phase tts_spike). Complete language lands over
# later phases: prompt.txt (translated_prompts), vo/ + cards/
# (localized_content). Loading fails fast until then, by design.
#
# voice: Puck — APPROVED by Waleed's listen test 2026-07-28 (consistency
# with the shipped EN videos). Record: reference/tts-spike.md.
lang = "ar"
name = "Arabic"
dir = "rtl"

[tts]
engine = "gemini"
model = "gemini-3.1-flash-tts-preview"
voice = "Puck"
style = "Say this as a warm, confident, genuinely engaging tutorial narrator, speaking Modern Standard Arabic — clearly glad to share it, good energy and momentum, but respectful and grounded, not hyped: "
# Prefix names the voice so a future voice change can't reuse stale cache.
cache_prefix = "ar-puck1"

[cards]
# Naskh for Arabic; slightly taller line box than the EN default.
css = """
  .wrap { font-family:'Noto Naskh Arabic','Geeza Pro',serif; }
  h1 { line-height:1.5; font-size:52px; }
  .kicker, .sub { line-height:1.6; }
"""

[recording]
prompt_url = "https://iaser.ai/ar/prompt"
prompt_url_display = "iaser.ai/ar/prompt"
copy_button_label = "Copy"  # staged pages use plain "Copy" x3 (full, part1, part2)
prompt_chars = 1160
gemini_part_min = 503
gemini_part2_leadin = "وتذكّر أيضًا، وأنت رفيقٌ لمسلمٍ ملتزم:"
gemini_part_max = 695
# PENDING: localized card strings (localized_content phase).
card_goto_line = "في متصفحك، اذهب إلى"
card_open_line = "الآن افتح"
account_label = "waleedkadous"

[youtube]
video_language = "Arabic"

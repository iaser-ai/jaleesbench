# Arabic — SKELETON (plan phase tts_spike). Complete language lands over
# later phases: prompt.txt (translated_prompts), vo/ + cards/
# (localized_content). Loading fails fast until then, by design.
#
# voice: Puck — APPROVED by Waleed's listen test 2026-07-28 (consistency
# with the shipped EN videos). Record: reference/tts-spike.md.
lang = "ar"
name = "Arabic"
dir = "rtl"

[tts]
engine = "gemini"
model = "gemini-3.1-flash-tts-preview"
voice = "Puck"
style = "Say this as a warm, confident, genuinely engaging tutorial narrator, speaking Modern Standard Arabic — clearly glad to share it, good energy and momentum, but respectful and grounded, not hyped: "
# Prefix names the voice so a future voice change can't reuse stale cache.
cache_prefix = "ar-puck1"

[cards]
# Naskh for Arabic; slightly taller line box than the EN default.
css = """
  .wrap { font-family:'Noto Naskh Arabic','Geeza Pro',serif; }
  h1 { line-height:1.5; font-size:52px; }
  .kicker, .sub { line-height:1.6; }
"""

[recording]
prompt_url = "https://iaser.ai/ar/prompt"
prompt_url_display = "iaser.ai/ar/prompt"
copy_button_label = "نسخ"  # public pages localize the button x3 (full, part1, part2)
prompt_chars = 1160
gemini_part_min = 503
gemini_part2_leadin = "وهذه بقية التوجيهات، فاعمل بها مع ما سبق. وكلها تخدم غاية واحدة: عونٌ صادق يترك أثرًا طيبًا:"
gemini_part_max = 749
# PENDING: localized card strings (localized_content phase).
card_goto_line = "في متصفحك، اذهب إلى"
card_open_line = "الآن افتح"
account_label = "waleedkadous"

# Gemini UI labels under ?hl=ar — observed live during the verification
# sessions (2026-07-28). Other assistants' ar labels are investigated at
# recording-session start (drivers fall back to locale-independent
# selectors where possible).
[recording.chatgpt_ui]
# All four VALIDATED live off-camera 2026-07-29 before the ar takes.
# `save` only renders once the field is dirty (with إلغاء) — a clean-state
# probe won't find it. toast_substr must stay the FULL phrase: the bare
# "التعليمات المخصصة" also matches the always-visible section button, so a
# shorter substring resolves against the heading instead of the toast.
personalization = "التخصيص"
ci_placeholder_substr = "تفضيلات إضافية"
save = "حفظ"
toast_substr = "تم تحديث التعليمات المخصصة"

[recording.gemini_ui]
add = "إضافة"
submit = "إرسال"
delete_all = "حذف الكل"

[youtube]
video_language = "Arabic"

[project]
name = "companion-pipeline"
version = "0.1.0"
description = "Reproducible pipeline for companion-prompt outreach assets: UI recordings, TTS narration, video assembly, captions, YouTube upload"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "playwright>=1.40",
    "httpx>=0.27",
]

[project.scripts]
companion = "companion_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_pipeline"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
]
